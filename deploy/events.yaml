# Consumer-specific subscription to the platform's existing Argo Events bus.
# Delivery supplies the target namespace and immutable release.
# Agent execution is deployed independently by azure.yaml; no GitOps edit is needed.
name: agent-catalog-sre
namespace: agent-catalog-sre

events:
  sources:
    readiness:
      resource:
        readiness:
          namespace: "" # Operator selects the investigation namespace.
          group: ""
          version: v1
          resource: events
          eventTypes: [ADD]
          filter: {afterStart: true}

  sensors:
    readiness:
      dependencies:
        - name: readiness
          eventSourceName: readiness # Chart resolves this local source key.
          eventName: readiness
          filters:
            data:
              - {path: type, type: string, value: ['^ADD$']}
              - {path: body.type, type: string, value: ['^Warning$']}
              - {path: body.reason, type: string, value: ['^Unhealthy$']}
              - {path: body.message, type: string, value: ['^Readiness probe failed:']}
              - {path: body.involvedObject.kind, type: string, value: ['^Pod$']}
              - {path: body.involvedObject.name, type: string, value: ['^api-']}
              - {path: body.metadata.uid, type: string, value: ['^[a-f0-9-]{36}$']}
      triggers:
        - template:
            name: investigate
            k8s:
              operation: create
              source:
                resource:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: sre-readiness
                  spec:
                    activeDeadlineSeconds: 240
                    backoffLimit: 0
                    ttlSecondsAfterFinished: 86400
                    template:
                      spec:
                        serviceAccountName: sre-broker
                        automountServiceAccountToken: true
                        restartPolicy: Never
                        nodeSelector: {agentpool: platform}
                        securityContext:
                          runAsNonRoot: true
                          seccompProfile: {type: RuntimeDefault}
                        containers:
                          - name: broker
                            image: ""
                            command: [python, -m, tools.broker]
                            securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities: {drop: [ALL]}
                            resources:
                              requests: {cpu: 50m, memory: 128Mi}
                              limits: {memory: 256Mi}
                            volumeMounts:
                              - {name: identity, mountPath: /var/run/secrets/azure, readOnly: true}
                        volumes:
                          - name: identity
                            projected:
                              sources:
                                - serviceAccountToken: {path: token, audience: api://AzureADTokenExchange, expirationSeconds: 3600}
              parameters:
                - src:
                    dependencyName: readiness
                    dataTemplate: '{{ printf "sre-%s" .Input.body.metadata.uid }}'
                  dest: metadata.name
          rateLimit: {unit: Minute, requestsPerUnit: 2}
