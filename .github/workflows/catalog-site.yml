name: Catalog site delivery

run-name: >-
  ${{ github.event_name == 'pull_request_target' &&
      format('Remove catalog preview — PR #{0}', github.event.pull_request.number) ||
      github.event_name == 'pull_request' &&
      format('Check catalog site PR #{0}{1}', github.event.pull_request.number,
        github.event.pull_request.head.repo.full_name == github.repository && ' and deploy preview' || '') ||
      github.ref == 'refs/heads/main' && 'Deploy production catalog site' ||
      format('Check catalog site — {0}', github.ref_name) }}

on:
  pull_request:
    paths:
      - site/**
      - agents/*/azure.yaml
      - .github/workflows/catalog-site.yml

  # Close events use trusted base code and run cleanup without build/path filters.
  pull_request_target:
    types: [closed]

  push:
    branches: [main]
    paths:
      - site/**
      - agents/*/azure.yaml
      - .github/workflows/catalog-site.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear:
    if: github.event_name == 'pull_request'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@17a409d93bb7a8d697ee33690adfc96bc9a8651d
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}

  validate:
    if: github.event_name != 'pull_request_target'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/validate.yml@f61b3e4f5c5db462c73581c0b95ddefef14b9569
    with:
      terraform-directories: '["site/terraform/container-app"]'
      tofu-version: '1.13.9'

  test:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/image/requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r site/image/requirements.txt

      - name: Check catalog navigation and architecture coverage
        run: python -m unittest discover -s site/image -p 'test_*.py'

  image:
    needs: [validate, test]

    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@35f848c7ac4fb5ba7765a8d4298a2d7a9289f340
    with:
      image: agent-catalog/site
      context: site/image
      tag: ${{ github.event_name == 'pull_request' && format('preview-{0}-{1}', github.event.pull_request.number, github.sha) || '' }}
      publish-preview: true
      scan: true
      build-engine: ${{ github.event_name == 'pull_request' && 'acr' || 'docker' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  infrastructure:
    name: ${{ github.ref == 'refs/heads/main' && 'Deploy production infrastructure' || 'Plan production infrastructure' }}
    needs: image
    # Publish/scan must succeed first. PRs plan; main pushes and manual runs apply.
    if: needs.image.outputs.digest != ''

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@edbf70b90121ad9ab1d96ddc4b7cad3cabce4bcd
    with:
      root: site/terraform/container-app
      tofu-version: '1.13.9'
      state-key: agent-catalog-hosting.tfstate
      variables: ${{ format('{{"image":"localacrk8s.azurecr.io/agent-catalog/site@{0}"}}', needs.image.outputs.digest) }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_RESOURCE_NAME: ${{ secrets.TF_BACKEND_RESOURCE_NAME }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}

  preview:
    name: ${{ github.event_name == 'pull_request_target' && 'Remove PR preview' || 'Deploy PR preview' }}
    needs: image
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'pull_request' && needs.image.result == 'success' && needs.image.outputs.digest != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: central-apply

    concurrency:
      group: catalog-site-preview-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ai-platform-portfolio/ops-shared/.github/actions/container-app-preview@ef2c9ebe3df131f3bf2a92c2a86e360dad95c5e6
        with:
          resource-group: rg-portfolio-hosting
          environment: portfolio-hosting
          registry: localacrk8s
          image: ${{ needs.image.outputs.digest && format('localacrk8s.azurecr.io/agent-catalog/site@{0}', needs.image.outputs.digest) || '' }}
          identity: portfolio-hosting
