name: Validate and publish agent

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue:
    if: github.event_name == 'pull_request'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@7ed775ef5c3077a99f49e859816ffc095c54d18a
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.lock && pip install --no-deps .
      - run: python -m unittest discover -s tests -v

      - run: python -m portfolio_agent_factory validate

      - run: python -m json.tool smoke/sre.json > /dev/null
      - run: python -m json.tool incidents/sre-staging.json > /dev/null

  image:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@7ed775ef5c3077a99f49e859816ffc095c54d18a
    with:
      image: portfolio/agent-catalog
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      publish-preview: true
      tag: ${{ github.event_name == 'pull_request' && format('preview-pr{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || '' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  release-record:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record immutable release input
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          REVISION: ${{ needs.image.outputs.revision }}
        run: |
          test -n "$DIGEST" && test -n "$REVISION"
          printf 'Image: `localacrk8s.azurecr.io/portfolio/agent-catalog@%s`\nRevision: `%s`\n' "$DIGEST" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
