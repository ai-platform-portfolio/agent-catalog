name: Deploy catalog agents

# TODO: Review whether this is the most efficient delivery approach, including
# matrix/job overhead and whether the per-agent artifact handoff can be simpler.

on:
  pull_request:
    paths: ['agents/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['agents/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a candidate, or route to a release after reviewing its evaluation artifacts.
        type: choice
        options: [deploy, promote, rollback]
        default: deploy

      agent:
        description: Agent directory name; required for promotion/rollback.
        type: string

      version:
        description: Exact validated Foundry version for promotion/rollback.
        type: string

      release-run:
        description: Successful main deployment run containing that version's evaluation artifacts.
        type: string

      expected-serving-version:
        description: Exact current serving version reviewed for this route change.
        type: string

      review-approved:
        description: Confirm that the evaluation and human rubric have been reviewed and approved.
        type: boolean
        default: false

      review-url:
        description: HTTPS reference to the approval review.
        type: string

      rollback-reason:
        description: Required reason for rollback (10-2048 characters).
        type: string

env:
  APPLICATION_CHART_REVISION: e8053eba011a9fe28fec997d723b20670795bac8 # native hosted gateway credentials

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      agents: ${{ steps.agents.outputs.agents }}
      image-prefix: ${{ steps.agents.outputs.image-prefix }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Discover native agent projects
        id: agents
        shell: bash
        env:
          OPERATION: ${{ inputs.operation || 'deploy' }}
          SELECTED_AGENT: ${{ inputs.agent }}
        run: |
          if [[ "$OPERATION" != deploy && ! "$SELECTED_AGENT" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo '::error::Promotion/rollback needs one explicit agent directory.'
            exit 1
          fi
          agents='[]'
          for directory in agents/*/; do
            [[ -d "$directory" ]] || continue
            agent=${directory%/}
            agent=${agent##*/}
            [[ "$OPERATION" == deploy || "$SELECTED_AGENT" == "$agent" ]] || continue
            environment="${GITHUB_REPOSITORY#*/}-$agent"
            [[ "$agent" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ && ${#environment} -le 63 &&
               ! -L "${directory%/}" && -f "$directory/azure.yaml" && ! -L "$directory/azure.yaml" &&
               ! -L "$directory/image" && -f "$directory/image/Dockerfile" && ! -L "$directory/image/Dockerfile" ]] || {
              echo '::error::Each agent needs regular azure.yaml and image/Dockerfile files and a lowercase name; repository-name plus agent must fit 63 characters.'
              exit 1
            }
            agents=$(jq -c --arg agent "$agent" '. + [$agent]' <<< "$agents")
          done
          [[ "$OPERATION" == deploy || "$agents" != '[]' ]] || exit 1
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "image-prefix=agents/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.agents != '[]' && (inputs.operation == '' || inputs.operation == 'deploy')

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@12e689fdd1d26fec21e80bf1c8adbfee1dd0b788
    with:
      image: ${{ needs.discover.outputs.image-prefix }}/${{ matrix.agent }}
      context: agents/${{ matrix.agent }}
      file: agents/${{ matrix.agent }}/image/Dockerfile
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      scan: true
      artifact-name: image-${{ matrix.agent }}

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: [discover, build]
    if: >-
      needs.discover.outputs.agents != '[]' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (inputs.operation == '' || inputs.operation == 'deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}

    concurrency:
      group: foundry-${{ github.repository }}-${{ matrix.agent }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo '::error::Refusing deployment from a stale source revision.'
            exit 1
          }

      - name: Download this agent's image record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.agent }}
          path: ${{ runner.temp }}/agent-image

      - name: Verify image record identity
        id: image
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_PATH: ${{ needs.discover.outputs.image-prefix }}/${{ matrix.agent }}
        run: |
          record="$RUNNER_TEMP/agent-image/image.json"
          jq -e --arg revision "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" --arg path "$IMAGE_PATH" '
            .revision == $revision and .repository == $repository and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.image | test("^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$")) and
            ((.image | sub("^[^/]+/"; "") | sub(":[^/:]+$"; "")) == $path)
          ' "$record" > /dev/null
          echo "image=$(jq -r '(.image | sub(":[^/:]+$"; "")) + "@" + .digest' "$record")" >> "$GITHUB_OUTPUT"

      - name: Install the agent's verified SDK and shared capabilities once
        working-directory: agents/${{ matrix.agent }}
        run: |
          python3 -m venv "$RUNNER_TEMP/evaluation-venv"
          "$RUNNER_TEMP/evaluation-venv/bin/pip" install --require-hashes --only-binary=:all: -r image/requirements.txt
          echo "$RUNNER_TEMP/evaluation-venv/bin" >> "$GITHUB_PATH"

      - name: Check out the reviewed application chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/application-helm-chart
          ref: ${{ env.APPLICATION_CHART_REVISION }}
          path: .application-chart
          persist-credentials: false

      - name: Authenticate for native gateway access
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve chart-owned public model connections
        uses: ai-platform-portfolio/ops-shared/.github/actions/gateway-access@5ceacf2c8a31601c19ec05d024b1b2c4dc3960c9
        with:
          operation: configure
          service: ${{ github.event.repository.name }}-${{ matrix.agent }}
          working-directory: agents/${{ matrix.agent }}
          chart-directory: .application-chart
          chart-revision: ${{ env.APPLICATION_CHART_REVISION }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster: ${{ vars.AKS_NAME }}

      - name: Deploy prebuilt digest with native azd
        id: candidate
        uses: ai-platform-portfolio/ops-shared/.github/actions/foundry-deploy@38a239a1068f766437a043c8a0d3fac337e71601
        with:
          service: ${{ matrix.agent }}
          project-id: ${{ vars.AZURE_AI_PROJECT_ID }}
          runtime-project-role-id: 53ca6127-db72-4b80-b1b0-d745d6d5456d # Foundry User, project scope
          image: ${{ steps.image.outputs.image }}
          environment: ${{ github.event.repository.name }}-${{ matrix.agent }}
          working-directory: agents/${{ matrix.agent }}
          location: ${{ vars.AZURE_LOCATION }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          source-revision: ${{ github.sha }}
          preserve-serving-version: 'true'
          traces-endpoint: ${{ vars.AGENT_TRACES_ENDPOINT }}
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          # Model connection metadata comes from the shared chart, never inline keys.
          LEGACY_MEMORY_UNTIL: ${{ vars.LEGACY_MEMORY_UNTIL }}
          METRICS_URL: ${{ vars.METRICS_URL }}
          METRICS_TOKEN_SCOPE: ${{ vars.METRICS_TOKEN_SCOPE }}
          AGENT_DIAGNOSTICS_BACKEND: ${{ vars.AGENT_DIAGNOSTICS_BACKEND || 'provided' }}
          KUBE_API_URL: ${{ vars.KUBE_API_URL }}
          KUBE_CA_PEM: ${{ vars.KUBE_CA_PEM }}
          KUBE_ALLOWED_NAMESPACE: ${{ vars.KUBE_ALLOWED_NAMESPACE }}
          KUBE_ALLOWED_WORKLOAD: ${{ vars.KUBE_ALLOWED_WORKLOAD }}

      - name: Reconcile credentials for the actual native principal
        uses: ai-platform-portfolio/ops-shared/.github/actions/gateway-access@5ceacf2c8a31601c19ec05d024b1b2c4dc3960c9
        with:
          operation: apply
          service: ${{ github.event.repository.name }}-${{ matrix.agent }}
          working-directory: agents/${{ matrix.agent }}
          chart-directory: .application-chart
          chart-revision: ${{ env.APPLICATION_CHART_REVISION }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster: ${{ vars.AKS_NAME }}
          release-record: ${{ steps.candidate.outputs.record }}

      - name: Evaluate the exact hosted candidate
        working-directory: agents/${{ matrix.agent }}
        env:
          SERVICE: ${{ matrix.agent }}
          AZURE_ENV_NAME: ${{ github.event.repository.name }}-${{ matrix.agent }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_RECORD: ${{ steps.candidate.outputs.record }}
          KUBE_ALLOWED_NAMESPACE: ${{ vars.KUBE_ALLOWED_NAMESPACE }}
          KUBE_ALLOWED_WORKLOAD: ${{ vars.KUBE_ALLOWED_WORKLOAD }}
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          cp "$RELEASE_RECORD" "$RUNNER_TEMP/acceptance/release.json"
          cp "$RUNNER_TEMP/gateway-$AZURE_ENV_NAME/connection.json" "$RUNNER_TEMP/acceptance/gateway.json"
          for case in evaluation/cases/*.yaml; do
            "$RUNNER_TEMP/evaluation-venv/bin/python" -m evaluation.run "$case" --mode hosted \
              --service "$SERVICE" --environment "$AZURE_ENV_NAME" --expected-version "$CANDIDATE_VERSION" \
              --release-record "$RELEASE_RECORD" > "$RUNNER_TEMP/acceptance/$(basename "$case" .yaml).json"
          done
          if "$RUNNER_TEMP/evaluation-venv/bin/python" -c 'from runtime.agent import load_config; raise SystemExit(not load_config().get("memory", {}).get("enabled", False))'; then
            "$RUNNER_TEMP/evaluation-venv/bin/python" -m evaluation.context "$SERVICE" "$AZURE_ENV_NAME" "$CANDIDATE_VERSION" \
              --review "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
              --knowledge-manifest "$RUNNER_TEMP/acceptance/knowledge.json" --output "$RUNNER_TEMP/acceptance/context.json"
          fi

      - name: Retain candidate and evaluation evidence
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.agent }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error

  release:
    needs: discover
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.operation == 'promote' || inputs.operation == 'rollback')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      id-token: write

    strategy:
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}

    concurrency:
      group: foundry-${{ github.repository }}-${{ matrix.agent }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require successful main deployment evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release-run }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ && "$VERSION" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || {
            echo '::error::Refusing a route change from stale main configuration.'
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e '.conclusion == "success" and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .path == ".github/workflows/deploy-agents.yml"' "$RUNNER_TEMP/source-run.json" > /dev/null
          echo "revision=$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.agent }}
          path: ${{ runner.temp }}/acceptance
          run-id: ${{ inputs.release-run }}
          github-token: ${{ github.token }}

      - name: Check for Azure Developer CLI
        id: azd
        run: command -v azd >/dev/null 2>&1 && echo 'installed=true' >> "$GITHUB_OUTPUT" || true

      - name: Install Azure Developer CLI when missing
        if: steps.azd.outputs.installed != 'true'
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
        with:
          version: 1.37.3

      - name: Authenticate and select the existing project
        working-directory: agents/${{ matrix.agent }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: ${{ github.event.repository.name }}-${{ matrix.agent }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          azd extension install azure.ai.agents --version 1.0.0 --no-prompt
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github --no-prompt
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          azd env set "FOUNDRY_PROJECT_ENDPOINT=$FOUNDRY_PROJECT_ENDPOINT" -e "$AZURE_ENV_NAME" --no-prompt

      - name: Route only to the validated immutable version
        working-directory: agents/${{ matrix.agent }}
        env:
          SERVICE: ${{ matrix.agent }}
          VERSION: ${{ inputs.version }}
          AZURE_ENV_NAME: ${{ github.event.repository.name }}-${{ matrix.agent }}
          EXPECTED_REVISION: ${{ steps.evidence.outputs.revision }}
          EXPECTED_SERVING_VERSION: ${{ inputs.expected-serving-version }}
          REVIEW_APPROVED: ${{ inputs.review-approved }}
          REVIEW_URL: ${{ inputs.review-url }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          ROLLBACK_REASON: ${{ inputs.rollback-reason }}
        run: |
          python3 -m venv "$RUNNER_TEMP/evaluation-venv"
          "$RUNNER_TEMP/evaluation-venv/bin/pip" install --require-hashes --only-binary=:all: -r image/requirements.txt
          "$RUNNER_TEMP/evaluation-venv/bin/python" -m evaluation.release "$SERVICE" "$VERSION" "$RUNNER_TEMP/acceptance"

      - name: Retain verified route change
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-${{ matrix.agent }}-${{ inputs.operation }}
          path: ${{ runner.temp }}/acceptance/routing.json
          if-no-files-found: error

  linear:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
