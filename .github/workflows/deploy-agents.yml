name: Deploy catalog agents

on:
  pull_request:
    paths: ['agents/**', '.github/workflows/deploy-agents.yml']
  push:
    branches: [main]
    paths: ['agents/**', '.github/workflows/deploy-agents.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      agents: ${{ steps.agents.outputs.agents }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Discover native agent projects
        id: agents
        shell: bash
        run: |
          agents='[]'
          for directory in agents/*/; do
            [[ -d "$directory" ]] || continue
            agent=${directory%/}
            agent=${agent##*/}
            environment="${GITHUB_REPOSITORY#*/}-$agent"
            [[ "$agent" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ && ${#environment} -le 63 &&
               ! -L "${directory%/}" && -f "$directory/azure.yaml" && ! -L "$directory/azure.yaml" ]] || {
              echo '::error::Each agent needs a regular azure.yaml and a lowercase name; repository-name plus agent must fit 63 characters.'
              exit 1
            }
            agents=$(jq -c --arg agent "$agent" '. + [$agent]' <<< "$agents")
          done
          echo "agents=$agents" >> "$GITHUB_OUTPUT"

  agents:
    needs: discover
    if: >-
      needs.discover.outputs.agents != '[]' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}

    concurrency:
      group: foundry-${{ github.repository }}-${{ matrix.agent }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$SOURCE_SHA" ]] || {
            echo '::error::Refusing deployment from a stale source revision.'
            exit 1
          }

      - name: Package and deploy agent with native azd
        uses: ai-platform-portfolio/ops-shared/.github/actions/foundry-deploy@a4b8fc8659cb863ef458d4880af18e99a3c25c89
        with:
          service: ${{ matrix.agent }}
          environment: ${{ github.event.repository.name }}-${{ matrix.agent }}
          working-directory: agents/${{ matrix.agent }}
          location: ${{ vars.AZURE_LOCATION }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}

  linear:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ai-platform-portfolio/ops-shared/.github/workflows/linear-issue-check.yml@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
    secrets:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
