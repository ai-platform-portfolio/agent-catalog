name: Build and deploy one catalog agent

on:
  workflow_call:
    inputs:
      agent:
        required: true
        type: string

      image:
        description: Registry repository path generated by catalog discovery.
        required: true
        type: string

      revision:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: false

      AZURE_TENANT_ID:
        required: false

      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read

# Serialize each agent's build/deploy lifecycle without cancelling a cloud write.
concurrency:
  group: foundry-${{ github.repository }}-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
    with:
      image: ${{ inputs.image }}
      context: agents/${{ inputs.agent }}
      file: agents/${{ inputs.agent }}/Dockerfile
      revision: ${{ inputs.revision }}

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: build

    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/foundry-deploy.yml@83d3982c4615a28a15130c0481947945c4952aad
    with:
      agent: ${{ inputs.agent }}
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      revision: ${{ needs.build.outputs.revision }}
      configuration: agents/${{ inputs.agent }}/deployment.json
      smoke-file: agents/${{ inputs.agent }}/smoke.json
      project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      deploy: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
