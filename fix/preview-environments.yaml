# SRE consumer intent. The release supplies the incident, exact base SHA,
# immutable worker image and platform GitHub App metadata after review.
agent:
  id: sre

policy:
  repository: ai-platform-portfolio/preview-environments
  editable_paths: [deploy/, tests/]
  checks:
    - [python, -m, unittest, discover, -s, tests, -p, test_readiness_contract.py]
  instructions: >-
    For readiness faults, compare the configured probe with the actual API
    routes and live HTTP evidence. Fix the narrow configuration error and add
    a regression test for the route contract. If the evidence does not support
    this repository or a concrete source change, abstain. Do not change
    authentication, networking, secrets or deployment permissions.
