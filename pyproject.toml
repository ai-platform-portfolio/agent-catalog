[project]
name = "portfolio-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "portfolio-agent-factory @ git+https://github.com/ai-platform-portfolio/application-library.git@087b49b9734f4a8a7ea97658e338455b0f02fd2b#subdirectory=agent-factory",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runtime*"]
