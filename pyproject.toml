[project]
name = "portfolio-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-agentserver-invocations>=1.3,<2",
  "azure-ai-projects>=2.7,<3",
  "azure-identity>=1.20,<2",
  "httpx>=0.28,<1",
  "openai>=3,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_factory*", "agent_runtime*"]
