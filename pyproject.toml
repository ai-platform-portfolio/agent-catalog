[project]
name = "portfolio-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "portfolio-agent-factory @ git+https://github.com/ai-platform-portfolio/application-library.git@e7ed8e6f09419f95c9fc881b56b08a8907465c94#subdirectory=agent-factory",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runtime*"]
