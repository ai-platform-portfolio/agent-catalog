# Existing project/model: this file deploys an agent, not another infrastructure stack.
name: sre

services:
  foundry:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

  sre:
    host: azure.ai.agent
    uses: [foundry]
    kind: hosted
    name: ${AZURE_ENV_NAME}
    project: .
    language: docker
    image: ${HOSTED_AGENT_IMAGE}

    hooks:
      predeploy:
        shell: sh
        run: python -m portfolio_agent_runtime.deployment config/agent.yaml

    metadata:
      source_revision: ${SOURCE_REVISION}
      image: ${RELEASE_IMAGE}

    docker:
      path: image/Dockerfile
      context: .
      remoteBuild: true

    protocols:
      - protocol: invocations
        version: 2.0.0

    agentEndpoint:
      protocols: [invocations]
      authorizationSchemes:
        - type: Entra

    env:
      MODEL_CONNECTION_MODE: ${MODEL_CONNECTION_MODE}
      MODEL_AUTH_METHOD: ${MODEL_AUTH_METHOD}
      MODEL_DEPLOYMENT_NAME: ${MODEL_DEPLOYMENT_NAME}
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_TOKEN_SCOPE: ${MODEL_TOKEN_SCOPE}
      MODEL_API_KEY_SECRET_URI: ${MODEL_API_KEY_SECRET_URI}
      CODING_MODEL_DEPLOYMENT_NAME: ${CODING_MODEL_DEPLOYMENT_NAME}
      CODING_MODEL_API_KEY_SECRET_URI: ${CODING_MODEL_API_KEY_SECRET_URI}
      EMBEDDING_MODEL_DEPLOYMENT_NAME: ${EMBEDDING_MODEL_DEPLOYMENT_NAME}
      EMBEDDING_MODEL_API_KEY_SECRET_URI: ${EMBEDDING_MODEL_API_KEY_SECRET_URI}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION}
      LEGACY_MEMORY_UNTIL: ${LEGACY_MEMORY_UNTIL}

      MEMORY_STORE_NAME: ${MEMORY_STORE_NAME}
      KNOWLEDGE_MANIFEST_JSON: ${KNOWLEDGE_MANIFEST_JSON}
      PYTHONNOUSERSITE: "1"
      DIAGNOSTICS_BACKEND: ${AGENT_DIAGNOSTICS_BACKEND}
      KUBE_API_URL: ${KUBE_API_URL}
      KUBE_CA_PEM: ${KUBE_CA_PEM}
      KUBE_ALLOWED_NAMESPACE: ${KUBE_ALLOWED_NAMESPACE}
      KUBE_ALLOWED_WORKLOAD: ${KUBE_ALLOWED_WORKLOAD}
      METRICS_URL: ${METRICS_URL}
      METRICS_TOKEN_SCOPE: ${METRICS_TOKEN_SCOPE}
      SOURCE_REVISION: ${SOURCE_REVISION}
      RELEASE_IMAGE: ${RELEASE_IMAGE}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${AGENT_TRACES_ENDPOINT}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
