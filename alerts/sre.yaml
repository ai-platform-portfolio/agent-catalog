# Agent-specific intent. The release supplies the namespace, immutable image,
# source revision and concrete Foundry version after publication.
agent:
  id: sre

# Overlay this file with fix/preview-environments.yaml. The operator supplies
# the target namespace/workload, source branch, immutable image and active agent version.
handoff:
  enabled: true
  publish: true
  requiredEvidence: [workload_state, recent_events]
  requireDegradedWorkload: true
